name: Publish Package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-compatible npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm check

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$(npm view "$package_name@$package_version" version 2>/dev/null || true)" == "$package_version" ]]; then
            echo "$package_name@$package_version is already published."
            exit 0
          fi

          if [[ "$package_version" == *-* ]]; then
            prerelease_tag="${package_version#*-}"
            prerelease_tag="${prerelease_tag%%.*}"

            if [[ "$prerelease_tag" =~ ^[0-9] ]]; then
              prerelease_tag="next"
            fi

            npm publish --access public --tag "$prerelease_tag"
          else
            npm publish --access public
          fi
