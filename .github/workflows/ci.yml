name: Node Cross-Platform CI

on:
  pull_request:
  push:
    # Filtering branches here prevents duplicate builds from pull_request and push.
    branches:
      - main
  # Early issue detection: run CI weekly on Sundays.
  schedule:
    - cron: '0 6 * * 0' # Runs at 06:00 on Sunday.

# Cancel older runs for the same branch or PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege for GITHUB_TOKEN.
permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
        node-version:
          - 22
          - 24

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Use Node ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Verify Node and PNPM Versions
        run: |
          node --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  pack-validation:
    name: Package Validation
    needs: build
    if: ${{ success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # renovate: datasource=github-releases depName=actions/setup-node enabled=false
          node-version: '24.18.0'
          check-latest: true
          cache: pnpm

      - name: Verify Node, npm, and PNPM Versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack Package
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          pnpm pack --pack-destination dist

          TARBALL="$(
            node -e "
              const packageJson = require('./package.json');
              const packageName = packageJson.name
                .replace(/^@/, '')
                .replace('/', '-');

              console.log(
                \`dist/\${packageName}-\${packageJson.version}.tgz\`
              );
            "
          )"

          if [[ ! -f "$TARBALL" ]]; then
            echo "::error title=Package tarball missing::Expected tarball was not created: $TARBALL"
            exit 1
          fi

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Package tarball::Tarball created at $TARBALL"

      - name: List Tarball Contents
        run: tar -tzf "${{ steps.pack.outputs.tarball }}"

      - name: Validate Package with Publint
        run: pnpm dlx publint@latest "${{ steps.pack.outputs.tarball }}"

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  consumer-smoke:
    name: Consumer Smoke Test (Node ${{ matrix.node-version }})
    needs: pack-validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Verify Node, npm, and PNPM Versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Download Package Tarball
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: dist

      - name: Locate Package Tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TARBALLS < <(
            find "$GITHUB_WORKSPACE/dist" \
              -maxdepth 1 \
              -type f \
              -name '*.tgz' \
              -print
          )

          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "::error title=Package tarball count::Expected exactly one tarball, found ${#TARBALLS[@]}."
            printf '%s\n' "${TARBALLS[@]}"
            exit 1
          fi

          TARBALL="${TARBALLS[0]}"

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Package tarball::Using $TARBALL"

      - name: Test CommonJS Consumer
        shell: bash
        run: |
          set -euo pipefail

          mkdir smoke-cjs
          cd smoke-cjs

          npm init -y >/dev/null

          pnpm add \
            --save-dev \
            --ignore-scripts \
            eslint \
            @stylistic/eslint-plugin \
            "${{ steps.pack.outputs.tarball }}"

          cat > sample.js <<'JS'
          function foo() {
            return 1;
          }

          foo();
          JS

          cat > invalid.js <<'JS'
          function bar(){return 2 }
          bar()
          JS

          cat > eslint.config.js <<'JS'
          'use strict';

          const cfgOrPromise = require('@alexdiliberto/eslint-config');

          module.exports = (async () => {
            const cfg = cfgOrPromise?.then
              ? await cfgOrPromise
              : (cfgOrPromise?.default ?? cfgOrPromise);

            if (!Array.isArray(cfg)) {
              throw new Error('Expected flat config array');
            }

            return cfg;
          })();
          JS

          pnpm exec eslint sample.js --max-warnings=0

          if pnpm exec eslint invalid.js >/dev/null 2>&1; then
            echo "Expected invalid.js to fail linting."
            exit 1
          fi

          pnpm exec eslint invalid.js --fix
          pnpm exec eslint invalid.js --max-warnings=0

      - name: Test ESM Consumer
        shell: bash
        run: |
          set -euo pipefail

          mkdir smoke-esm
          cd smoke-esm

          npm init -y >/dev/null

          node -e "
            const fs = require('fs');
            const packageJson = require('./package.json');

            packageJson.type = 'module';

            fs.writeFileSync(
              'package.json',
              JSON.stringify(packageJson, null, 2) + '\n'
            );
          "

          pnpm add \
            --save-dev \
            --ignore-scripts \
            eslint \
            @stylistic/eslint-plugin \
            "${{ steps.pack.outputs.tarball }}"

          cat > sample.js <<'JS'
          function foo() {
            return 1;
          }

          foo();
          JS

          cat > invalid.js <<'JS'
          function bar(){return 2 }
          bar()
          JS

          cat > eslint.config.mjs <<'JS'
          import cfg from '@alexdiliberto/eslint-config';

          export default Array.isArray(cfg)
            ? cfg
            : (cfg?.default ?? cfg);
          JS

          pnpm exec eslint sample.js --max-warnings=0

          if pnpm exec eslint invalid.js >/dev/null 2>&1; then
            echo "Expected invalid.js to fail linting."
            exit 1
          fi

          pnpm exec eslint invalid.js --fix
          pnpm exec eslint invalid.js --max-warnings=0